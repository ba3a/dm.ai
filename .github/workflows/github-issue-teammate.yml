name: GitHub Issue Teammate

# Dispatches the AI Teammate workflow for a GitHub issue when the trigger label is added.
# Only users with triage access can add labels, which is the authorization gate.
run-name: "GitHub issue #${{ github.event.issue.number || inputs.issue_number }}"

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == (vars.GH_ISSUE_TRIGGER_LABEL || 'dmtools:develop')
    steps:
      - name: Dispatch AI Teammate
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          CONFIG_FILE: ${{ vars.GH_ISSUE_AGENT_CONFIG || 'agents/story_development.json' }}
        run: |
          if ! [[ "${ISSUE_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Issue number must be numeric"
            exit 1
          fi
          ISSUE_KEY="${REPOSITORY}#${ISSUE_NUMBER}"
          # customParams.trackerProvider is set explicitly because the agent scripts' GraalJS
          # context cannot read the DEFAULT_TRACKER env var and would fall back to Jira.
          ENCODED_CONFIG=$(jq -cn --arg jql "${ISSUE_KEY}" \
            '{params: {inputJql: $jql, customParams: {trackerProvider: "github"}}}')
          echo "Dispatching ${CONFIG_FILE} for ${ISSUE_KEY}"
          gh workflow run ai-teammate.yml \
            --repo "${REPOSITORY}" \
            -f config_file="${CONFIG_FILE}" \
            -f encoded_config="${ENCODED_CONFIG}" \
            -f concurrency_key="${ISSUE_KEY}" \
            -f tracker=github
